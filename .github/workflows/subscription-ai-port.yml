name: Apply subscription AI port

on:
  push:
    branches: [feature/subscription-ai-runtimes]
    paths:
      - scripts/port_subscription_ai.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/subscription-ai-runtimes
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply deterministic patch
        run: python scripts/port_subscription_ai.py
      - name: Commit generated port
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cookbook/serializer.py cookbook/views/api.py cookbook/helper/ai_runtime.py requirements.txt Dockerfile
          git diff --cached --check
          git commit -m 'Wire Tandoor AI endpoints to subscription runtimes'
          git push origin HEAD:feature/subscription-ai-runtimes
